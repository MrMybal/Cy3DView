name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build xorg-dev libgl1-mesa-dev libgl1-mesa-dri libcurl4-openssl-dev xvfb
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        shell: bash
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF
      - name: Build
        run: cmake --build build/Release --parallel 3
      - name: Import tests
        run: ctest --test-dir build/Release -LE gpu --output-on-failure
      - name: Validate exported glTF
        shell: bash
        run: |
          npm install --prefix build/validation --cache build/npm-cache --ignore-scripts --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          node tools/validate_exports.cjs build/Release/extension-tests-épreuve build/validation/node_modules/gltf-validator
      - name: Linux GPU tests
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/Release -L gpu --output-on-failure
      - name: Portable package
        run: cmake --install build/Release --prefix dist/Cy3DView
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_installer.ps1
      - name: Windows install and upgrade tests
        if: runner.os == 'Windows'
        shell: pwsh
        # Standard hosted Windows VMs may only provide the legacy GDI OpenGL driver.
        # Import/payload/install tests stay required; only explicit unsupported-driver errors qualify.
        run: ./tools/installer_test.ps1 -AllowMissingOpenGL
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: Cy3DView-Windows-installer-diagnostics
          path: build/installer-test-*/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Cy3DView-Windows-installer
          path: dist/*-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Cy3DView-${{ runner.os }}
          path: dist/Cy3DView
